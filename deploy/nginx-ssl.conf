worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    client_max_body_size 20m;

    # مهم: الافتراضي ~8×4k ≈ 32KB فيقطع CSS/الصور الكبيرة عبر proxy_pass
    proxy_http_version 1.1;
    proxy_buffering on;
    proxy_buffer_size 256k;
    proxy_buffers 32 256k;
    proxy_busy_buffers_size 512k;
    proxy_temp_file_write_size 256k;
    proxy_max_temp_file_size 1024m;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # إعادة توجيه HTTP → HTTPS (اختياري عبر منفذ 8080 داخلي إن لزم)
    server {
        listen 8080;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /app/certs/cert.pem;
        ssl_certificate_key /app/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # فضّل خدمة /static/ من القرص إن وُجد المسار (أسرع وأأمن من تمرير الملفات عبر Gunicorn)
        location /static/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            expires 1h;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header Connection "";
        }
    }
}
