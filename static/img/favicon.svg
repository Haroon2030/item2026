<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="4" y1="0" x2="28" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2f6fbd"/>
      <stop offset="100%" stop-color="#163e74"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Bold barcode rhythm — readable at 16px -->
  <g fill="#ffffff">
    <rect x="5.5" y="7" width="2" height="18" rx="1"/>
    <rect x="9.5" y="7" width="3.5" height="18" rx="1"/>
    <rect x="15" y="7" width="1.6" height="18" rx=".8"/>
    <rect x="18.5" y="7" width="4" height="18" rx="1"/>
    <rect x="24.5" y="7" width="2" height="18" rx="1"/>
  </g>
  <!-- Scan laser -->
  <rect x="4.5" y="14.5" width="23" height="3" rx="1.5" fill="#a8d8ff" opacity=".88"/>
  <!-- Item/data marker -->
  <circle cx="25.5" cy="23.5" r="3.2" fill="#9fd0ff"/>
  <circle cx="25.5" cy="23.5" r="1.35" fill="#12345f"/>
</svg>
