<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مبيعات الرشيد">
  <meta name="theme-color" content="#0a3550">
  <title>مبيعات الرشيد</title>
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png?v={{ app_client_version }}">
  <link rel="stylesheet" href="/static/css/mobile-app.css?v={{ app_client_version }}">
</head>
<body>
  <div id="app"></div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
  </script>
  <script src="/static/js/mobile-app.js?v={{ app_client_version }}"></script>
</body>
</html>
