<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}بيانات الأصناف — بحث بالباركود{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand-wrap">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <path d="M3.3 7L12 12l8.7-5"/>
            <path d="M12 22V12"/>
          </svg>
        </span>
        <div>
          <p class="brand">بيانات الأصناف</p>
          <p class="tagline">بحث وفهرسة الأصناف بالباركود</p>
        </div>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/js/vendor/html5-qrcode.min.js" defer></script>
  <script src="/static/js/sync-progress.js" defer></script>
  <script src="/static/js/barcode-scanner.js" defer></script>
</body>
</html>
