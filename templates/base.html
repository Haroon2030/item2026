<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}بيانات الأصناف — بحث بالباركود{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="app-backdrop" aria-hidden="true">
    <span class="app-orb app-orb-a"></span>
    <span class="app-orb app-orb-b"></span>
    <span class="app-grid"></span>
  </div>
  <div class="page {% block page_class %}{% endblock %}">
    <header class="topbar">
      <div class="brand-wrap">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <path d="M3.3 7L12 12l8.7-5"/>
            <path d="M12 22V12"/>
          </svg>
        </span>
        <div class="brand-copy">
          <p class="brand">بيانات الأصناف</p>
          <p class="tagline">بحث وفهرسة الأصناف بالباركود</p>
        </div>
        {% if request.user.is_authenticated %}
          <div class="topbar-actions">
            <button type="button" class="btn-refresh" id="btn-refresh" title="تحديث الصفحة" aria-label="تحديث الصفحة">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 2v6h-6"/>
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                <path d="M3 22v-6h6"/>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
              </svg>
              <span class="btn-refresh-text">تحديث</span>
            </button>
            <a class="btn-users" href="{% url 'stock_cost' %}" title="تكلفة المخزون حسب المجموعة">تكلفة المخزون</a>
            {% if request.user.is_staff %}
              <a class="btn-users" href="{% url 'user_list' %}" title="إدارة المستخدمين">المستخدمون</a>
            {% endif %}
            <form method="post" action="{% url 'logout' %}" class="logout-form">
              {% csrf_token %}
              <button type="submit" class="btn-logout" title="تسجيل الخروج">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                </svg>
                خروج
              </button>
            </form>
          </div>
        {% endif %}
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/js/vendor/zxing.min.js" defer></script>
  <script src="/static/js/vendor/zxing-browser.min.js" defer></script>
  <script src="/static/js/sync-progress.js" defer></script>
  <script src="/static/js/barcode-scanner.js" defer></script>
  <script src="/static/js/stock-cost.js?v=20260727c" defer></script>
</body>
</html>
