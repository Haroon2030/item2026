<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="المبيعات اليومية ومبيعات المجموعات">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مبيعات الرشيد">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>مبيعات الرشيد</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0f3a66;
    }
    #boot {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      gap: 0.6rem;
    }
    #boot strong { font-size: 1.35rem; }
    #boot span { color: #d7e6f0; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div id="boot">
    <strong>مبيعات الرشيد</strong>
    <span id="boot-msg">جاري التحميل…</span>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
    function bootMsg(text) {
      var el = document.getElementById('boot-msg');
      if (el) el.textContent = text;
    }
    setTimeout(function () {
      if (document.getElementById('boot')) {
        bootMsg('ما زال التحميل جارياً… تحقق من الشبكة ثم حدّث الصفحة.');
      }
    }, 20000);
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      config: {
        renderer: "canvaskit",
        useLocalCanvasKit: true,
        canvasKitBaseUrl: "canvaskit/",
        suppressMultithreadingWarning: true,
      },
      onEntrypointLoaded: async function (engineInitializer) {
        try {
          bootMsg('جاري تجهيز التطبيق…');
          const appRunner = await engineInitializer.initializeEngine({
            renderer: "canvaskit",
            useLocalCanvasKit: true,
            canvasKitBaseUrl: "canvaskit/",
          });
          const boot = document.getElementById("boot");
          if (boot) boot.remove();
          await appRunner.runApp();
        } catch (err) {
          bootMsg('تعذّر فتح التطبيق. حدّث الصفحة.');
          console.error(err);
        }
      }
    }).catch(function (err) {
      bootMsg('تعذّر فتح التطبيق. حدّث الصفحة.');
      console.error(err);
    });
  </script>
</body>
</html>
